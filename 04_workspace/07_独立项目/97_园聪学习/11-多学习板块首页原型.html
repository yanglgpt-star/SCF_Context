<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>园聪学习 · 多板块首页</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#ecefeb;color:#514a62;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}.stage{min-height:100vh;display:grid;place-items:center;padding:24px}.phone{position:relative;width:390px;height:844px;overflow:hidden;border:9px solid #27302d;border-radius:48px;background:linear-gradient(155deg,#faf4eb,#f2edf6 58%,#edf5f3);box-shadow:0 24px 60px #283c3530}.notch{position:absolute;z-index:5;top:8px;left:50%;width:110px;height:26px;transform:translateX(-50%);border-radius:20px;background:#27302d}.screen{height:100%;overflow-y:auto;padding:46px 20px 88px;scrollbar-width:none}.top{display:flex;align-items:center;justify-content:space-between}.user{display:flex;align-items:center;gap:9px;font-size:15px;font-weight:700}.avatar{display:grid;place-items:center;width:44px;height:44px;border-radius:15px;background:#fff;font-size:24px}.stars{padding:9px 13px;border-radius:18px;background:#fff9;font-size:14px;font-weight:700}.recommend{position:relative;min-height:235px;margin:20px 0 24px;padding:20px;overflow:hidden;border:1px solid #8d7fa42b;border-radius:27px;background:#ffffffc9;box-shadow:0 8px 23px #443b5710}.tag{display:inline-block;padding:5px 9px;border-radius:10px;background:#ebe5f2;color:#68578f;font-size:11px;font-weight:800}.recommend h1{max-width:190px;margin:11px 0 5px;font-size:23px}.recommend p{margin:0;color:#746e7b;font-size:13px}.scene{position:absolute;right:14px;top:40px;font-size:68px}.dots{display:flex;gap:6px;margin-top:15px}.dots i{width:9px;height:9px;border-radius:50%;background:#d8d1df}.dots i.on{background:#75649b}.start{width:100%;height:55px;margin-top:17px;border:0;border-radius:18px;background:#75649b;color:white;font-size:18px;font-weight:800;box-shadow:0 6px 15px #68518d30;cursor:pointer}.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.section-head h2{margin:0;font-size:19px}.listen{width:42px;height:42px;border:0;border-radius:15px;background:#ffffffad;font-size:18px;cursor:pointer}.modules{display:grid;grid-template-columns:1fr 1fr;gap:13px}.module{position:relative;min-height:150px;padding:17px;border:1px solid #ffffff80;border-radius:24px;text-align:left;cursor:pointer;transition:.15s}.module:active{transform:scale(.98)}.module.purple{background:#e8e1ef}.module.green{background:#e3efe6}.module.blue{background:#e2edf1}.module.orange{background:#f2e7da}.module-icon{font-size:42px}.module h3{margin:9px 0 7px;font-size:17px}.module-state{color:#716a78;font-size:11px}.mini-dots{display:flex;gap:4px;margin-top:10px}.mini-dots i{width:7px;height:7px;border-radius:50%;background:#ffffffb8}.mini-dots i.on{background:#75649b}.badge{position:absolute;top:13px;right:13px;padding:4px 7px;border-radius:9px;background:#fff9;color:#6e617b;font-size:10px;font-weight:800}.coming{filter:saturate(.55);opacity:.82}.bottom{position:absolute;z-index:3;left:0;right:0;bottom:0;display:flex;justify-content:space-around;padding:12px 20px calc(12px + env(safe-area-inset-bottom));border-top:1px solid #ffffff90;background:#f8f4efed;backdrop-filter:blur(10px)}.bottom span{text-align:center;color:#716a77;font-size:10px}.bottom b{display:block;margin-bottom:2px;font-size:21px}.toast{position:absolute;z-index:10;left:50%;bottom:90px;max-width:80%;padding:11px 17px;transform:translateX(-50%) translateY(15px);border-radius:20px;background:#3e3947ed;color:#fff;text-align:center;font-size:12px;opacity:0;transition:.2s}.toast.show{opacity:1;transform:translateX(-50%)}
@media(max-width:430px){.stage{padding:0}.phone{width:100%;height:100vh;border:0;border-radius:0}.notch{display:none}.screen{padding-top:20px}}
</style>
</head>
<body><main class="stage"><div class="phone"><div class="notch"></div><div class="screen">
<header class="top"><div class="user"><div class="avatar">🐻</div><span>你好，小聪</span></div><div class="stars">⭐ 12</div></header>
<section class="recommend"><span class="tag">今天玩什么</span><h1>去数字乐园帮助小兔</h1><p>5 个小游戏 · 大约 3 分钟</p><div class="scene">🐰🥕</div><div class="dots"><i class="on"></i><i class="on"></i><i></i><i></i><i></i></div><button class="start" data-name="数字乐园">▶ 开始玩</button></section>
<div class="section-head"><h2>学习乐园</h2><button class="listen" id="listen">🔊</button></div>
<section class="modules">
  <article class="module purple" data-name="数字乐园"><div class="module-icon">🥕</div><h3>数字乐园</h3><div class="module-state">继续学习</div><div class="mini-dots"><i class="on"></i><i class="on"></i><i></i><i></i><i></i></div></article>
  <article class="module green" data-name="说话森林"><span class="badge">新</span><div class="module-icon">🐦</div><h3>说话森林</h3><div class="module-state">看图说一说</div><div class="mini-dots"><i></i><i></i><i></i><i></i><i></i></div></article>
  <article class="module blue coming" data-coming="true" data-name="发现世界"><span class="badge">准备中</span><div class="module-icon">🔍</div><h3>发现世界</h3><div class="module-state">颜色与形状</div></article>
  <article class="module orange coming" data-coming="true" data-name="思考工坊"><span class="badge">准备中</span><div class="module-icon">🧩</div><h3>思考工坊</h3><div class="module-state">配对与规律</div></article>
</section></div>
<nav class="bottom"><span><b>⭐</b>收获</span><span><b>🏠</b>首页</span><span id="parent"><b>👨‍👩‍👧</b>长按家长</span></nav><div class="toast" id="toast"></div></div></main>
<script>
const toast=document.querySelector('#toast');function say(text){toast.textContent='🔊 '+text;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1800)}
document.querySelectorAll('[data-name]').forEach(card=>card.onclick=()=>card.dataset.coming?say(card.dataset.name+'还在准备，很快就能玩啦'):say('正在进入'+card.dataset.name));
document.querySelector('#listen').onclick=()=>say('这里是学习乐园，选一个你喜欢的地方吧');let timer;const parent=document.querySelector('#parent');parent.onpointerdown=()=>timer=setTimeout(()=>say('进入家长中心'),1500);parent.onpointerup=()=>clearTimeout(timer);parent.onpointerleave=()=>clearTimeout(timer);
</script></body></html>
